# Smithery config for local (stdio) deployment. Not published to npm or Smithery.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      evmPrivateKey:
        type: string
        description: Private key of your own Base wallet holding USDC (optional; without it paid tools pay nothing).
      maxPaymentUsdc:
        type: string
        default: "0.05"
        description: Per-call spend cap in USDC.
      maxTotalUsdc:
        type: string
        default: "0.50"
        description: Session total spend cap in USDC.
  # No launch command: x402-arabic-mcp is NOT published on npm, so `npx -y x402-arabic-mcp` would fail.
  # Run it from a clone instead: see "Install (run from the repo)" in mcp/README.md
  # (git clone, npm ci, npm run build, then point your MCP client at node <clone>/mcp/dist/index.js).
